<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YuvaSanghamam 2026 - Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #FF9B31; --secondary: #28D1B4; --dark: #1e1e1e; --light: #f4f6f9; --gray: #e9ecef; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--light); color: var(--dark); min-height: 100vh; display: flex; flex-direction: column; }
        
        nav { background: var(--dark); color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .nav-title { font-size: 18px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        
        .main-container { display: flex; max-width: 1300px; margin: 30px auto; padding: 0 20px; width: 100%; gap: 30px; flex: 1; }
        .login-wrapper { display: flex; justify-content: center; align-items: center; width: 100%; min-height: 70vh; }
        .login-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 400px; }
        
        .sidebar { width: 280px; display: flex; flex-direction: column; gap: 10px; }
        .tab-btn { padding: 15px 20px; background: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 15px; text-align: left; display: flex; align-items: center; gap: 12px; color: var(--dark); box-shadow: 0 2px 8px rgba(0,0,0,0.04); transition: all 0.2s; }
        .tab-btn.active { background: var(--primary); color: white; }

        .content-pane { flex: 1; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .panel { display: none; }
        .panel.active { display: block; }
        .hidden { display: none !important; }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 14px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 11px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        
        .btn { padding: 10px 22px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-danger { background: #d9534f; }

        .chat-container { display: flex; height: 500px; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; background: #fff; }
        .chat-user-list { width: 30%; border-right: 1px solid #ddd; overflow-y: auto; }
        .chat-user-item { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; }
        .chat-user-item.active { background: var(--gray); }
        .chat-window-area { width: 70%; display: flex; flex-direction: column; }
        .chat-messages-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .chat-bubble { padding: 10px 14px; border-radius: 8px; max-width: 80%; }
        .chat-bubble.user { background: #e3f2fd; align-self: flex-start; }
        .chat-bubble.admin { background: #e8f5e9; align-self: flex-end; }
        .chat-reply-box { padding: 12px; border-top: 1px solid #ddd; background: #f9f9f9; display: flex; flex-direction: column; gap: 8px; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-title"><i class="fa-solid fa-shield-halved"></i> Admin Control Panel</div>
        <button id="logoutBtn" class="btn btn-danger hidden" onclick="handleLogout()">Logout</button>
    </nav>

    <div id="loginScreen" class="login-wrapper">
        <div class="login-box">
            <h2>Admin Login</h2>
            <form onsubmit="handleLogin(event)">
                <div class="form-group"><label>Username</label><input type="text" id="adminUser" required></div>
                <div class="form-group"><label>Password</label><input type="password" id="adminPass" required></div>
                <button type="submit" class="btn" style="width:100%">Login</button>
            </form>
        </div>
    </div>

    <div id="dashScreen" class="main-container hidden">
        <div class="sidebar">
            <button class="tab-btn active" onclick="switchAdminTab('add-post-panel', this)">Add New</button>
            <button class="tab-btn" onclick="switchAdminTab('chat-panel', this)">Manage Chat</button>
        </div>

        <div class="content-pane">
            <div id="add-post-panel" class="panel active">
                <h3>Add New Post</h3>
                <form id="postForm" onsubmit="handleSavePost(event)">
                    <!-- Add form fields here -->
                    <button type="submit" class="btn">Publish</button>
                </form>
            </div>

            <div id="chat-panel" class="panel">
                <h3>User Chat</h3>
                <div class="chat-container">
                    <div class="chat-user-list" id="chatUserList"></div>
                    <div class="chat-window-area" id="chatWindowArea">Select a user to chat.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://selzpjnwbohrjefcgbpj.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNlbHpwam53Ym9ocmplZmNnYnBqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NjYxNTgsImV4cCI6MjEwMjU0MjE1OH0.tUhmcCIqSqauwBZvazbbndPy9wPoRBW33-UcFzmHiSA';
        let supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let currentActiveUser = null;

        function handleLogin(e) {
            e.preventDefault();
            if(document.getElementById('adminUser').value === 'admin' && document.getElementById('adminPass').value === 'vsk2026') {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('dashScreen').classList.remove('hidden');
                document.getElementById('logoutBtn').classList.remove('hidden');
                loadAdminChats();
            }
        }

        async function loadAdminChats() {
            const { data } = await supabaseClient.from('yuva_chats').select('sender_name').distinct();
            const list = document.getElementById('chatUserList');
            list.innerHTML = data.map(u => `<div class="chat-user-item" onclick="selectUser('${u.sender_name}')">${u.sender_name}</div>`).join('');
        }

        function selectUser(userName) {
            currentActiveUser = userName;
            loadMessages(userName);
        }

        async function loadMessages(userName) {
            const { data } = await supabaseClient.from('yuva_chats').select('*').or(`sender_name.eq.${userName},recipient_id.eq.${userName}`).order('id', {ascending: true});
            document.getElementById('chatWindowArea').innerHTML = `
                <div class="chat-messages-box" id="msgBox">
                    ${data.map(m => `<div class="chat-bubble ${m.is_admin ? 'admin' : 'user'}">${m.message}</div>`).join('')}
                </div>
                <div class="chat-reply-box">
                    <input type="text" id="adminReplyText" placeholder="Reply...">
                    <input type="file" id="adminFile">
                    <button class="btn" onclick="sendAdminReply()">Send</button>
                </div>
            `;
        }

        async function sendAdminReply() {
            const msg = document.getElementById('adminReplyText').value;
            const file = document.getElementById('adminFile').files[0];
            let fileUrl = '';

            if(file) {
                const { data } = await supabaseClient.storage.from('uploads').upload(Date.now() + file.name, file);
                fileUrl = supabaseClient.storage.from('uploads').getPublicUrl(data.path).data.publicUrl;
            }

            await supabaseClient.from('yuva_chats').insert([{
                sender_name: 'Admin',
                recipient_id: currentActiveUser,
                message: msg + (fileUrl ? `\nFile: ${fileUrl}` : ''),
                is_admin: true
            }]);
            loadMessages(currentActiveUser);
        }
        
        function switchAdminTab(id, btn) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>
